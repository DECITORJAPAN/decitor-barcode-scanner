<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no">

  <title>DECITOR BARCODE SCANNER</title>

  <!-- ZXing -->
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f5f7;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;
    }

    .app {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    .header {
      padding: 18px;
      background: #1f2937;
      color: #fff;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
    }

    .header-sub {
      margin-top: 4px;
      font-size: 12px;
      opacity: .75;
    }

    .content {
      padding: 22px 16px 40px;
    }

    .title {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .description {
      margin-bottom: 18px;
      color: #63707a;
      font-size: 14px;
      line-height: 1.7;
    }

    .camera-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      min-height: 300px;
      background: #000;
      object-fit: cover;
    }

    /*
     * 送り状の横長バーコード用ガイド
     */
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 5%;
      width: 90%;
      height: 120px;
      transform: translateY(-50%);
      border: 4px solid rgba(255,255,255,.95);
      border-radius: 8px;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      top: 50%;
      left: 8%;
      width: 84%;
      height: 2px;
      background: rgba(255, 70, 70, .85);
      pointer-events: none;
    }

    .status {
      margin-top: 16px;
      padding: 13px;
      border-radius: 8px;
      background: #eef3f6;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .success {
      background: #e8f6ed;
      color: #176b4d;
    }

    .error {
      background: #fdecea;
      color: #a61b13;
    }

    #resultBox {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #bcd9c8;
      border-radius: 10px;
      background: #f0f8f3;
      text-align: center;
    }

    .result-label {
      font-size: 14px;
      color: #63707a;
    }

    .number {
      margin-top: 8px;
      font-size: 25px;
      font-weight: 700;
      word-break: break-all;
    }

    .format {
      margin-top: 7px;
      color: #63707a;
      font-size: 12px;
    }

    button {
      width: 100%;
      min-height: 54px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #176b4d;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary {
      background: #fff;
      border: 1px solid #aeb8c1;
      color: #374650;
    }

    .hint {
      margin-top: 14px;
      color: #74808a;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

  </style>
</head>


<body>

<div class="app">

  <header class="header">

    <div class="header-title">
      DECITOR BARCODE SCANNER
    </div>

    <div class="header-sub">
      入荷問合番号 読取
    </div>

  </header>


  <main class="content">

    <h1 class="title">
      📷 バーコード読取
    </h1>

    <div class="description">
      送り状のバーコードを白い枠の中に合わせてください。
      認識すると自動で読み取ります。
    </div>


    <div class="camera-box">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="scan-guide"></div>
      <div class="scan-line"></div>

    </div>


    <div
      id="status"
      class="status">
      カメラを起動しています...
    </div>


    <div id="resultBox">

      <div class="result-label">
        読み取り結果
      </div>

      <div
        id="resultNumber"
        class="number">
      </div>

      <div
        id="resultFormat"
        class="format">
      </div>

      <button
        type="button"
        onclick="returnToPortal()">
        入荷ポータルへ戻る
      </button>

      <button
        type="button"
        class="secondary"
        onclick="restartScanner()">
        もう一度読む
      </button>

    </div>


    <div class="hint">
      バーコード全体が白い枠の中に入る距離で読み取ってください。<br>
      カメラを近づけすぎる必要はありません。
    </div>

  </main>

</div>


<script>

/*************************************************
 * STATE
 *************************************************/

let codeReader = null;
let controls = null;

let scanLocked = false;
let scannedNumber = '';

let currentStream = null;


/*************************************************
 * START
 *************************************************/

window.addEventListener(
  'load',
  startScanner
);


async function startScanner() {

  scanLocked = false;
  scannedNumber = '';

  document.getElementById(
    'resultBox'
  ).style.display = 'none';

  setStatus(
    'カメラを起動しています...',
    ''
  );


  try {

    /*
     * 読み取り対象を1次元バーコード中心に指定
     */
    const hints = new Map();

    const formats = [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_93,
      ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E
    ];

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      formats
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );


    codeReader =
      new ZXing.BrowserMultiFormatReader(
        hints
      );


    /*
     * 背面カメラを優先
     */
    const devices =
      await codeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        '利用できるカメラが見つかりません。'
      );
    }


    let selectedDeviceId =
      devices[devices.length - 1].deviceId;


    /*
     * カメラ名が取得できる場合は
     * back / rear / environment を優先
     */
    const rearCamera =
      devices.find(device => {

        const label =
          String(
            device.label || ''
          ).toLowerCase();

        return (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment')
        );

      });


    if (rearCamera) {
      selectedDeviceId =
        rearCamera.deviceId;
    }


    setStatus(
      'バーコードを読み取ってください',
      ''
    );


    /*
     * 連続読取開始
     */
    await codeReader.decodeFromVideoDevice(
      selectedDeviceId,
      'video',

      (result, error) => {

        if (
          result &&
          !scanLocked
        ) {

          barcodeSuccess(result);
        }

        /*
         * NotFoundException は
         * 「そのフレームでは読めなかった」
         * だけなので無視する
         */
        if (
          error &&
          !(
            error instanceof
            ZXing.NotFoundException
          )
        ) {

          console.log(
            'decode:',
            error
          );
        }
      }
    );


    /*
     * iPhoneで可能なら
     * カメラ解像度を高めに要求
     */
    const video =
      document.getElementById(
        'video'
      );

    if (
      video &&
      video.srcObject
    ) {

      currentStream =
        video.srcObject;

      const tracks =
        currentStream.getVideoTracks();

      if (
        tracks &&
        tracks.length
      ) {

        const track =
          tracks[0];

        const capabilities =
          track.getCapabilities
            ? track.getCapabilities()
            : {};


        const constraints = {
          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }
        };


        /*
         * continuous autofocus が
         * 利用可能なブラウザでは要求する
         */
        if (
          capabilities.focusMode &&
          capabilities.focusMode.includes(
            'continuous'
          )
        ) {

          constraints.advanced = [
            {
              focusMode:
                'continuous'
            }
          ];
        }


        try {

          await track.applyConstraints(
            constraints
          );

        } catch (e) {

          console.log(
            'camera constraints:',
            e
          );
        }
      }
    }

  } catch (error) {

    console.error(error);

    setStatus(
      'カメラ起動エラー：' +
      (
        error && error.message
          ? error.message
          : String(error)
      ),
      'error'
    );
  }
}


/*************************************************
 * SUCCESS
 *************************************************/

async function barcodeSuccess(
  result
) {

  if (scanLocked) {
    return;
  }


  const rawValue =
    result.getText
      ? result.getText()
      : String(result.text || '');


  const value =
    normalizeTracking(
      rawValue
    );


  if (!value) {
    return;
  }


  scanLocked = true;
  scannedNumber = value;


  try {

    if (
      navigator.vibrate
    ) {
      navigator.vibrate(100);
    }

  } catch (e) {}


  let formatName = '';

  try {

    if (result.getBarcodeFormat) {

      formatName =
        String(
          result.getBarcodeFormat()
        );
    }

  } catch (e) {}


  await stopScanner();


  document.getElementById(
    'resultNumber'
  ).textContent =
    scannedNumber;


  document.getElementById(
    'resultFormat'
  ).textContent =
    formatName
      ? '形式：' + formatName
      : '';


  document.getElementById(
    'resultBox'
  ).style.display =
    'block';


  setStatus(
    '✓ 読み取り完了',
    'success'
  );
}


/*************************************************
 * STOP
 *************************************************/

async function stopScanner() {

  try {

    if (codeReader) {
      codeReader.reset();
    }

  } catch (e) {
    console.log(e);
  }


  try {

    if (currentStream) {

      currentStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );
    }

  } catch (e) {
    console.log(e);
  }


  currentStream = null;
  codeReader = null;
  controls = null;
}


/*************************************************
 * RESTART
 *************************************************/

async function restartScanner() {

  await stopScanner();

  scanLocked = false;
  scannedNumber = '';

  document.getElementById(
    'resultBox'
  ).style.display =
    'none';

  await startScanner();
}


/*************************************************
 * NORMALIZE
 *************************************************/

function normalizeTracking(
  value
) {

  let tracking =
    String(value || '')
      .trim()
      .replace(/\s+/g, '');


  /*
   * バーコードに付加される
   * 前後アルファベットを除去
   *
   * d500984340920d
   *   ↓
   * 500984340920
   */

  tracking =
    tracking
      .replace(
        /^[A-Za-z]+(?=\d)/,
        ''
      )
      .replace(
        /(?<=\d)[A-Za-z]+$/,
        ''
      );


  return tracking;
}


/*************************************************
 * RETURN TO PORTAL
 *************************************************/

function returnToPortal() {

  if (!scannedNumber) {
    return;
  }


  /*
   * 今は単体テスト。
   *
   * 読取成功を確認したあと
   * GASポータルへ番号を返す処理に変更する。
   */

  alert(
    '読取番号：' +
    scannedNumber +
    '\n\n' +
    'バーコード読取成功です。'
  );
}


/*************************************************
 * STATUS
 *************************************************/

function setStatus(
  message,
  type
) {

  const box =
    document.getElementById(
      'status'
    );


  box.textContent =
    message;


  box.className =
    'status' +
    (
      type
        ? ' ' + type
        : ''
    );
}

</script>

</body>
</html>
