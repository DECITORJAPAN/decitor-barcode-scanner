<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>DECITOR BARCODE SCANNER</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f5f7;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
}

.app {
  width: 100%;
  max-width: 620px;
  min-height: 100vh;
  margin: 0 auto;
  background: #fff;
}

.header {
  padding: 18px;
  background: #1f2937;
  color: #fff;
}

.header-title {
  font-size: 18px;
  font-weight: 700;
}

.header-sub {
  margin-top: 4px;
  font-size: 12px;
  opacity: .75;
}

.content {
  padding: 22px 16px 40px;
}

.title {
  margin: 0 0 8px;
  font-size: 24px;
  font-weight: 700;
}

.description {
  margin-bottom: 18px;
  color: #63707a;
  font-size: 14px;
  line-height: 1.7;
}

.camera-box {
  position: relative;
  width: 100%;
  height: 390px;
  overflow: hidden;
  border-radius: 12px;
  background: #000;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 実際に解析する位置 */
.scan-guide {
  position: absolute;
  left: 4%;
  top: 50%;
  width: 92%;
  height: 135px;
  transform: translateY(-50%);
  border: 4px solid #fff;
  border-radius: 8px;
  pointer-events: none;
}

.scan-line {
  position: absolute;
  left: 7%;
  top: 50%;
  width: 86%;
  height: 2px;
  background: #ff4040;
  pointer-events: none;
}

.status {
  margin-top: 16px;
  padding: 13px;
  border-radius: 8px;
  background: #eef3f6;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
}

.success {
  background: #e8f6ed;
  color: #176b4d;
}

.error {
  background: #fdecea;
  color: #a61b13;
}

#resultBox {
  display: none;
  margin-top: 18px;
  padding: 18px;
  border: 1px solid #bcd9c8;
  border-radius: 10px;
  background: #f0f8f3;
  text-align: center;
}

.result-label {
  font-size: 14px;
  color: #63707a;
}

.number {
  margin-top: 8px;
  font-size: 26px;
  font-weight: 700;
  word-break: break-all;
}

.format {
  margin-top: 8px;
  color: #63707a;
  font-size: 12px;
}

button {
  width: 100%;
  min-height: 54px;
  margin-top: 16px;
  border: 0;
  border-radius: 10px;
  background: #176b4d;
  color: #fff;
  font-size: 17px;
  font-weight: 700;
}

.secondary {
  background: #fff;
  border: 1px solid #aeb8c1;
  color: #374650;
}

.hint {
  margin-top: 14px;
  color: #74808a;
  font-size: 12px;
  line-height: 1.7;
  text-align: center;
}

/* 解析用。画面には表示しない */
#scanCanvas {
  display: none;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="header-title">
    DECITOR BARCODE SCANNER
  </div>

  <div class="header-sub">
    入荷問合番号 読取
  </div>
</header>

<main class="content">

<h1 class="title">
  📷 バーコード読取
</h1>

<div class="description">
  問合番号のバーコードを白い枠の中央に合わせてください。<br>
  認識すると自動で読み取ります。
</div>

<div class="camera-box">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div class="scan-guide"></div>
  <div class="scan-line"></div>

</div>

<div id="status" class="status">
  カメラを起動しています...
</div>

<div id="resultBox">

  <div class="result-label">
    読み取り結果
  </div>

  <div id="resultNumber" class="number"></div>

  <div id="resultFormat" class="format"></div>

  <button type="button" onclick="returnToPortal()">
    入荷ポータルへ戻る
  </button>

  <button
    type="button"
    class="secondary"
    onclick="restartScanner()">
    もう一度読む
  </button>

</div>

<div class="hint">
  バーコード全体が白枠の中に入ればOKです。<br>
  無理にカメラを近づける必要はありません。
</div>

<canvas id="scanCanvas"></canvas>

</main>
</div>

<script>

/*************************************************
 * STATE
 *************************************************/

let stream = null;
let scanTimer = null;
let scanLocked = false;
let scannedNumber = '';

let reader = null;


/*************************************************
 * LOAD
 *************************************************/

window.addEventListener(
  'load',
  startScanner
);


/*************************************************
 * START
 *************************************************/

async function startScanner() {

  scanLocked = false;
  scannedNumber = '';

  document.getElementById(
    'resultBox'
  ).style.display = 'none';

  setStatus(
    'カメラを起動しています...',
    ''
  );

  try {

    /*
     * 1次元バーコードだけを対象
     */
    const hints = new Map();

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.CODE_93,
        ZXing.BarcodeFormat.CODABAR,
        ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E
      ]
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );

    reader =
      new ZXing.BrowserMultiFormatReader(
        hints
      );


    /*
     * iPhone背面カメラ
     * 高めの解像度を要求
     */
    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: 'environment'
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    stream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    const video =
      document.getElementById(
        'video'
      );

    video.srcObject =
      stream;

    await video.play();


    /*
     * 対応していれば
     * continuous autofocus を要求
     */
    try {

      const track =
        stream.getVideoTracks()[0];

      const capabilities =
        track.getCapabilities
          ? track.getCapabilities()
          : {};

      if (
        capabilities.focusMode &&
        capabilities.focusMode.includes(
          'continuous'
        )
      ) {

        await track.applyConstraints({
          advanced: [
            {
              focusMode:
                'continuous'
            }
          ]
        });

      }

    } catch (e) {

      console.log(
        'focus setting:',
        e
      );

    }


    setStatus(
      'バーコードを読み取ってください',
      ''
    );


    /*
     * 250msごとに
     * 白枠部分だけ解析
     */
    scanTimer =
      setInterval(
        scanFrame,
        250
      );

  } catch (error) {

    console.error(error);

    setStatus(
      'カメラ起動エラー：' +
      (
        error && error.message
          ? error.message
          : String(error)
      ),
      'error'
    );

  }

}


/*************************************************
 * SCAN FRAME
 *************************************************/

function scanFrame() {

  if (
    scanLocked ||
    !reader
  ) {
    return;
  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return;
  }


  const canvas =
    document.getElementById(
      'scanCanvas'
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently: true
      }
    );


  /*
   * カメラ映像の中央部分のみ使用
   *
   * 横：94%
   * 縦：38%
   *
   * 送り状の横長バーコード向け
   */
  const sourceWidth =
    Math.floor(
      video.videoWidth * 0.94
    );

  const sourceHeight =
    Math.floor(
      video.videoHeight * 0.38
    );


  const sourceX =
    Math.floor(
      (
        video.videoWidth -
        sourceWidth
      ) / 2
    );


  const sourceY =
    Math.floor(
      (
        video.videoHeight -
        sourceHeight
      ) / 2
    );


  /*
   * 切り出した映像を
   * 2倍サイズへ拡大
   */
  const scale = 2;


  canvas.width =
    sourceWidth * scale;

  canvas.height =
    sourceHeight * scale;


  ctx.imageSmoothingEnabled =
    false;


  ctx.drawImage(
    video,

    sourceX,
    sourceY,
    sourceWidth,
    sourceHeight,

    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
   * ZXingで
   * 切り出しCanvasだけ解析
   */
  try {

    const result =
      reader.decodeFromCanvas(
        canvas
      );


    if (result) {
      barcodeSuccess(
        result
      );
    }

  } catch (error) {

    /*
     * 読めないフレームは正常。
     * 次の250msで再試行。
     */

    if (
      !(
        error instanceof
        ZXing.NotFoundException
      )
    ) {

      console.log(
        'decode:',
        error
      );

    }

  }

}


/*************************************************
 * SUCCESS
 *************************************************/

async function barcodeSuccess(
  result
) {

  if (scanLocked) {
    return;
  }


  const raw =
    result.getText();


  const value =
    normalizeTracking(
      raw
    );


  if (!value) {
    return;
  }


  scanLocked = true;
  scannedNumber = value;


  if (scanTimer) {

    clearInterval(
      scanTimer
    );

    scanTimer = null;

  }


  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        100
      );

    }

  } catch (e) {}


  let formatName = '';

  try {

    const format =
      result.getBarcodeFormat();

    formatName =
      barcodeFormatName(
        format
      );

  } catch (e) {}


  /*
   * 読めたらカメラ停止
   */
  stopCamera();


  document.getElementById(
    'resultNumber'
  ).textContent =
    scannedNumber;


  document.getElementById(
    'resultFormat'
  ).textContent =
    formatName
      ? '形式：' + formatName
      : '';


  document.getElementById(
    'resultBox'
  ).style.display =
    'block';


  setStatus(
    '✓ 読み取り完了',
    'success'
  );

}


/*************************************************
 * FORMAT NAME
 *************************************************/

function barcodeFormatName(
  format
) {

  const map = {};

  map[
    ZXing.BarcodeFormat.CODE_128
  ] = 'CODE 128';

  map[
    ZXing.BarcodeFormat.CODE_39
  ] = 'CODE 39';

  map[
    ZXing.BarcodeFormat.CODE_93
  ] = 'CODE 93';

  map[
    ZXing.BarcodeFormat.CODABAR
  ] = 'CODABAR';

  map[
    ZXing.BarcodeFormat.ITF
  ] = 'ITF';

  map[
    ZXing.BarcodeFormat.EAN_13
  ] = 'EAN-13 / JAN';

  map[
    ZXing.BarcodeFormat.EAN_8
  ] = 'EAN-8';

  map[
    ZXing.BarcodeFormat.UPC_A
  ] = 'UPC-A';

  map[
    ZXing.BarcodeFormat.UPC_E
  ] = 'UPC-E';


  return (
    map[format] ||
    String(format)
  );

}


/*************************************************
 * NORMALIZE
 *************************************************/

function normalizeTracking(
  value
) {

  let tracking =
    String(
      value || ''
    )
      .trim()
      .replace(
        /\s+/g,
        ''
      );


  /*
   * 前後の英字を除去
   *
   * d500984340920d
   * ↓
   * 500984340920
   */
  tracking =
    tracking
      .replace(
        /^[A-Za-z]+(?=\d)/,
        ''
      )
      .replace(
        /(?<=\d)[A-Za-z]+$/,
        ''
      );


  return tracking;

}


/*************************************************
 * STOP CAMERA
 *************************************************/

function stopCamera() {

  if (scanTimer) {

    clearInterval(
      scanTimer
    );

    scanTimer = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  stream = null;

}


/*************************************************
 * RESTART
 *************************************************/

async function restartScanner() {

  stopCamera();

  scanLocked = false;
  scannedNumber = '';

  document.getElementById(
    'resultBox'
  ).style.display =
    'none';


  await startScanner();

}


/*************************************************
 * RETURN TO PORTAL
 *************************************************/

function returnToPortal() {

  if (!scannedNumber) {
    return;
  }


  /*
   * 現在は単体テスト。
   * 成功確認後、
   * GASポータルへ番号を返す。
   */

  alert(
    '読取番号：' +
    scannedNumber +
    '\n\n' +
    'バーコード読取成功です。'
  );

}


/*************************************************
 * STATUS
 *************************************************/

function setStatus(
  message,
  type
) {

  const box =
    document.getElementById(
      'status'
    );


  box.textContent =
    message;


  box.className =
    'status' +
    (
      type
        ? ' ' + type
        : ''
    );

}


/*************************************************
 * PAGE CLOSE
 *************************************************/

window.addEventListener(
  'pagehide',
  stopCamera
);

</script>

</body>
</html>
